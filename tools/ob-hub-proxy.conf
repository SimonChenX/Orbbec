# ob-hub 反向代理 —— 由宝塔 vhost 的 extension include 自动加载
#   include /www/server/panel/vhost/nginx/extension/camera.internal.jiayouexp.com/*.conf;
# 放在这里的好处：不用改宝塔面板生成的主配置文件，面板重新保存 vhost 也不会丢。
#
# 后端：127.0.0.1:9500（Go 服务 ob-hub），只监听本机，不对公网暴露。

# 所有 /api/* 走同一条规则（status / config / pose / depth_at …）
# 新增接口不用再来改 nginx —— 之前就是漏了 /api/pose 导致骨骼一直不显示。
location ^~ /api/ {
    proxy_pass http://127.0.0.1:9500;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 512k;      # 姿态 JSON 提交
    proxy_buffering off;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store";
}

location = /healthz {
    proxy_pass http://127.0.0.1:9500/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
}

# 单帧快照（^~ 保证优先于面板里 .jpg 的静态缓存规则）
location ^~ /snapshot/ {
    proxy_pass http://127.0.0.1:9500;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    add_header Cache-Control "no-store";
}

# MJPEG 长连接：必须关缓冲、放大超时，否则画面会被 nginx 攒着不发
location ~ ^/(color|depth|ir|screen)\.mjpg$ {
    proxy_pass http://127.0.0.1:9500;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}